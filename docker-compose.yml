version: '3.8'
services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: hyperliquid-local-db
    environment:
      POSTGRES_USER: hyperuser
      POSTGRES_PASSWORD: hyperpass
      POSTGRES_DB: hyperliquid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
